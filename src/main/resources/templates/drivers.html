<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driver Management</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        margin: 0;
        padding: 30px 20px;
        color: #1e293b;
      }
      .container {
        max-width: 1000px;
        margin: auto;
      }
      .card {
        background: white;
        padding: 24px;
        margin-bottom: 22px;
        border-radius: 12px;
        box-shadow: 0 3px 12px #0000000d;
      }
      h1,
      h2 {
        color: #17365d;
      }
      label {
        display: block;
        margin: 14px 0 6px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 11px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
      }
      button {
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        color: white;
        background: #17365d;
      }
      .toggle {
        margin-top: 0;
      }
      .available-button {
        background: #b91c1c;
      }
      .unavailable-button {
        background: #15803d;
      }
      .message {
        padding: 12px;
        border-radius: 6px;
        margin: 12px 0;
      }
      .success {
        background: #dcfce7;
        color: #166534;
      }
      .error {
        background: #fee2e2;
        color: #991b1b;
      }
      .status-available {
        color: #15803d;
        font-weight: bold;
      }
      .status-unavailable {
        color: #b91c1c;
        font-weight: bold;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 650px;
      }
      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #e2e8f0;
        text-align: left;
      }
      th {
        background: #f8fafc;
      }
      a {
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Driver Management</h1>
      <p>Register drivers and manage their availability.</p>

      <div class="card">
        <h2>Add a Driver</h2>

        <div
          th:if="${successMessage}"
          class="message success"
          th:text="${successMessage}"
        ></div>
        <div
          th:if="${errorMessage}"
          class="message error"
          th:text="${errorMessage}"
        ></div>

        <form th:action="@{/drivers}" th:object="${driver}" method="post">
          <label for="name">Driver Name</label>
          <input
            id="name"
            type="text"
            th:field="*{name}"
            placeholder="Enter driver's name"
            required
          />
          <p class="error" th:errors="*{name}"></p>

          <label for="phone">Phone Number</label>
          <input
            id="phone"
            type="tel"
            th:field="*{phone}"
            maxlength="10"
            pattern="[0-9]{10}"
            placeholder="10-digit phone number"
            required
          />
          <p class="error" th:errors="*{phone}"></p>

          <button type="submit">Add Driver</button>
        </form>
      </div>

      <div class="card">
        <h2>Registered Drivers</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Availability</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="d : ${drivers}">
                <td th:text="${d.id}"></td>
                <td th:text="${d.name}"></td>
                <td th:text="${d.phone}"></td>
                <td>
                  <span th:if="${d.available}" class="status-available"
                    >Available</span
                  >
                  <span th:unless="${d.available}" class="status-unavailable"
                    >Unavailable</span
                  >
                </td>
                <td>
                  <form
                    th:action="@{/drivers/{id}/availability(id=${d.id})}"
                    method="post"
                  >
                    <button
                      type="submit"
                      class="toggle"
                      th:classappend="${d.available} ? ' available-button' : ' unavailable-button'"
                      th:text="${d.available} ? 'Mark Unavailable' : 'Mark Available'"
                    ></button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(drivers)}">
                <td colspan="5">No drivers registered yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <p>
        <a th:href="@{/}">Home</a> |
        <a th:href="@{/shifts}">Shift Scheduling</a>
      </p>
    </div>
  </body>
</html>

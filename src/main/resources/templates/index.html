<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driver Shift Roster</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        margin: 0;
        padding: 50px 20px;
        text-align: center;
      }
      .container {
        max-width: 650px;
        margin: auto;
        padding: 40px;
        background: white;
        border-radius: 14px;
        box-shadow: 0 4px 15px #00000012;
      }
      h1 {
        color: #17365d;
      }
      p {
        color: #475569;
        line-height: 1.7;
      }
      .status {
        display: inline-block;
        padding: 10px 18px;
        background: #dcfce7;
        color: #166534;
        border-radius: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Driver Shift Roster System</h1>
      <p>
        Manage driver shifts and organize daily schedules through one
        centralized system.
      </p>
      <div class="status">Application is Running</div>
      <p>Backend: Spring Boot</p>
      <p>Database: MySQL</p>
    </div>
  </body>
</html>

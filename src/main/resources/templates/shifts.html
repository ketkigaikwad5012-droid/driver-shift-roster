<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driver Shift Roster | Scheduling</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
      }

      header {
        background: #17365d;
        color: white;
        padding: 22px 30px;
      }

      header h1 {
        margin: 0 0 8px;
      }

      header p {
        margin: 0;
        color: #dbeafe;
      }

      .container {
        width: 92%;
        max-width: 1050px;
        margin: 30px auto;
      }

      .navigation {
        display: flex;
        gap: 18px;
        margin-bottom: 22px;
      }

      .navigation a {
        color: #1d4ed8;
        text-decoration: none;
        font-weight: bold;
      }

      .card {
        background: white;
        padding: 25px;
        margin-bottom: 24px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
      }

      h2 {
        margin-top: 0;
        color: #17365d;
      }

      label {
        display: block;
        margin: 16px 0 7px;
        font-weight: bold;
      }

      input,
      select {
        display: block;
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 15px;
        background: white;
      }

      input:focus,
      select:focus {
        outline: 2px solid #93c5fd;
        border-color: #2563eb;
      }

      button {
        margin-top: 22px;
        padding: 12px 20px;
        border: none;
        border-radius: 7px;
        background: #17365d;
        color: white;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover {
        background: #24528a;
      }

      .message {
        padding: 12px;
        margin-bottom: 16px;
        border-radius: 7px;
      }

      .success {
        background: #dcfce7;
        color: #166534;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 600px;
      }

      th,
      td {
        text-align: left;
        padding: 13px;
        border-bottom: 1px solid #e2e8f0;
      }

      th {
        background: #f8fafc;
        color: #334155;
      }

      .empty {
        text-align: center;
        color: #64748b;
        padding: 25px;
      }

      footer {
        text-align: center;
        color: #64748b;
        padding: 20px;
      }

      @media (max-width: 600px) {
        .container {
          width: 95%;
          margin-top: 18px;
        }

        .card {
          padding: 17px;
        }

        header {
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Driver Shift Roster</h1>
      <p>Schedule drivers and manage working hours.</p>
    </header>

    <main class="container">
      <nav class="navigation">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/drivers}">Driver Management</a>
        <a th:href="@{/shifts}">Shift Scheduling</a>
      </nav>

      <section class="card">
        <h2>Create a Shift</h2>

        <div
          th:if="${successMessage}"
          class="message success"
          th:text="${successMessage}"
        ></div>

        <div
          th:if="${errorMessage}"
          class="message error"
          th:text="${errorMessage}"
        ></div>

        <form th:action="@{/shifts}" method="post">
          <label for="driverId">Select Driver</label>
          <select id="driverId" name="driverId" required>
            <option value="">Choose a registered driver</option>
            <option
              th:each="driver : ${drivers}"
              th:value="${driver.id}"
              th:text="${driver.name + ' - ' + driver.phone}"
            ></option>
          </select>

          <label for="shiftDate">Shift Date</label>
          <input
            id="shiftDate"
            type="date"
            name="shiftDate"
            th:min="${today}"
            required
          />

          <label for="startTime">Start Time</label>
          <input id="startTime" type="time" name="startTime" required />

          <label for="endTime">End Time</label>
          <input id="endTime" type="time" name="endTime" required />

          <button type="submit">Schedule Shift</button>
        </form>
      </section>

      <section class="card">
        <h2>Scheduled Shifts</h2>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Shift ID</th>
                <th>Driver</th>
                <th>Date</th>
                <th>Start Time</th>
                <th>End Time</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="shift : ${shifts}">
                <td th:text="${shift.id}"></td>
                <td th:text="${shift.driver.name}"></td>
                <td th:text="${shift.shiftDate}"></td>
                <td th:text="${shift.startTime}"></td>
                <td th:text="${shift.endTime}"></td>
              </tr>

              <tr th:if="${#lists.isEmpty(shifts)}">
                <td colspan="5" class="empty">No shifts scheduled yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>Containerized Driver Shift Roster System</footer>
  </body>
</html>
